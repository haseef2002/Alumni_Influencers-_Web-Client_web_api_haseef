<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Portal | Secure Access</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="auth-card">
        <h2>Alumni Portal</h2>
        
        <div id="alertBox" class="alert"></div>

        <form id="loginForm">
            <div class="input-group">
                <label>University Email</label>
                <input type="email" id="loginEmail" placeholder="student@university.edu" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <div class="input-group">
                <label>Connecting as (API Scope Test):</label>
                <select id="clientPlatform">
                    <option value="dashboard">Dashboard (Full Analytics Access)</option>
                    <option value="mobile_ar">Mobile AR App (Limited Access)</option>
                </select>
            </div>
            <button type="submit" class="btn-full" id="loginBtn">Secure Login</button>
            <span class="toggle-link" id="showRegisterBtn">Need an account? Register here</span>
        </form>

        <form id="registerForm" class="hidden">
            <div class="input-group">
                <label>University Email</label>
                <input type="email" id="regEmail" placeholder="must end in @university.edu" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Min 8 characters" required>
            </div>
            <button type="submit" class="btn-full" id="regBtn">Create Account</button>
            <span class="toggle-link" id="showLoginBtn">Already have an account? Login</span>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
